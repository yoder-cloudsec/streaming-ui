apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streaming-ui
  template:
    metadata:
      labels:
        app: streaming-ui
    spec:
      containers:
        - name: streaming-ui
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
